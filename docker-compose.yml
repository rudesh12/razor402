services:
  gateway:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    env_file: .env
    command: uvicorn gateway.app:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - merchant

  merchant:
    build: .
    ports:
      - "9000:9000"
    volumes:
      - .:/app
    working_dir: /app
    env_file: .env
    command: uvicorn merchant.app:app --host 0.0.0.0 --port 9000 --reload
