<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razor402 — Live Dashboard</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --card: #12121a;
            --border: #1e1e2e;
            --text: #e2e2f0;
            --muted: #8888a0;
            --accent: #6366f1;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
            --blue: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh;
        }
        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16162a 100%);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { font-size: 1.25rem; font-weight: 600; }
        header h1 span { color: var(--accent); }
        .status { display: flex; gap: 1rem; align-items: center; }
        .badge {
            padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem;
            font-weight: 600; text-transform: uppercase;
        }
        .badge-valid { background: rgba(34,197,94,0.15); color: var(--green); }
        .badge-invalid { background: rgba(239,68,68,0.15); color: var(--red); }
        .badge-pending { background: rgba(234,179,8,0.15); color: var(--yellow); }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1rem; padding: 1rem 2rem;
            max-height: calc(100vh - 4rem); overflow: hidden;
        }
        .column { display: flex; flex-direction: column; gap: 0.75rem; overflow-y: auto; max-height: calc(100vh - 5rem); }
        .column h2 {
            font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em;
            color: var(--muted); padding: 0.5rem 0; position: sticky; top: 0;
            background: var(--bg); z-index: 1;
        }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 0.5rem; padding: 0.75rem; font-size: 0.8rem;
            transition: border-color 0.2s;
        }
        .card:hover { border-color: var(--accent); }
        .card-title { font-weight: 600; margin-bottom: 0.25rem; }
        .card-meta { color: var(--muted); font-size: 0.7rem; }
        .card-price { color: var(--accent); font-weight: 700; }

        .txn-state {
            display: inline-block; padding: 0.15rem 0.5rem;
            border-radius: 4px; font-size: 0.65rem; font-weight: 700;
        }
        .s-ISSUED { background: rgba(99,102,241,0.2); color: #818cf8; }
        .s-VERIFIED { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .s-SETTLING, .s-SETTLEMENT_UNKNOWN { background: rgba(234,179,8,0.2); color: #fbbf24; }
        .s-SETTLED { background: rgba(34,197,94,0.2); color: #4ade80; }
        .s-FULFILLED { background: rgba(34,197,94,0.3); color: #22c55e; }
        .s-FAILED { background: rgba(239,68,68,0.2); color: #f87171; }
        .s-COMPENSATING, .s-COMPENSATED { background: rgba(168,85,247,0.2); color: #c084fc; }
        .s-DEAD_LETTER { background: rgba(239,68,68,0.3); color: #ef4444; }
        .s-FULFILLING { background: rgba(34,197,94,0.15); color: #86efac; }

        .budget-bar {
            height: 8px; background: var(--border); border-radius: 4px;
            overflow: hidden; margin: 0.5rem 0;
        }
        .budget-fill {
            height: 100%; border-radius: 4px;
            transition: width 0.5s ease;
        }
        .budget-green { background: linear-gradient(90deg, #22c55e, #4ade80); }
        .budget-yellow { background: linear-gradient(90deg, #eab308, #fbbf24); }
        .budget-red { background: linear-gradient(90deg, #ef4444, #f87171); }

        .audit-event {
            font-family: 'Fira Code', monospace; font-size: 0.7rem;
            padding: 0.25rem 0; border-bottom: 1px solid var(--border);
        }
        .audit-event:last-child { border-bottom: none; }
        .seq { color: var(--muted); width: 3em; display: inline-block; }
        .event-name { color: var(--accent); }
        .timestamp { color: var(--muted); font-size: 0.65rem; float: right; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .live-dot {
            width: 8px; height: 8px; background: var(--green);
            border-radius: 50%; animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <header>
        <h1><span>Razor402</span> — Live Dashboard</h1>
        <div class="status">
            <div class="live-dot"></div>
            <span style="font-size:0.75rem; color:var(--muted)">Polling</span>
            <span id="chain-badge" class="badge badge-pending">chain: checking…</span>
        </div>
    </header>

    <div class="grid">
        <div class="column">
            <h2>📦 Catalog</h2>
            <div id="catalog"></div>
        </div>
        <div class="column">
            <h2>💳 Transactions</h2>
            <div id="txns"></div>
        </div>
        <div class="column">
            <h2>🛡 Audit & Budget</h2>
            <div id="budget-card" class="card"></div>
            <div id="audit"></div>
        </div>
    </div>

    <script>
        const BASE = window.location.origin;

        function paise(p) {
            const r = Math.abs(p) / 100;
            return (p < 0 ? '-' : '') + '₹' + r.toFixed(2);
        }

        function timeAgo(ts) {
            const diff = Math.floor(Date.now()/1000) - ts;
            if (diff < 60) return diff + 's ago';
            if (diff < 3600) return Math.floor(diff/60) + 'm ago';
            return Math.floor(diff/3600) + 'h ago';
        }

        async function fetchJSON(url) {
            try {
                const r = await fetch(url);
                return await r.json();
            } catch { return null; }
        }

        async function refreshCatalog() {
            const data = await fetchJSON(BASE + '/api/v1/catalog');
            if (!data) return;
            const el = document.getElementById('catalog');
            el.innerHTML = Object.entries(data).map(([id, item]) => `
                <div class="card">
                    <div class="card-title">${item.title || id}</div>
                    <div style="display:flex;justify-content:space-between;margin-top:0.25rem">
                        <span class="card-meta">${item.category}</span>
                        <span class="card-price">${paise(item.price_paise)}</span>
                    </div>
                    ${item.description ? `<div class="card-meta" style="margin-top:0.25rem;font-style:italic">${item.description.slice(0,80)}…</div>` : ''}
                </div>
            `).join('');
        }

        async function refreshTxns() {
            const data = await fetchJSON(BASE + '/api/v1/txns?limit=20');
            if (!data) return;
            const el = document.getElementById('txns');
            el.innerHTML = data.transactions.map(t => `
                <div class="card">
                    <div style="display:flex;justify-content:space-between">
                        <span class="card-title" style="font-size:0.75rem">${t.item_id}</span>
                        <span class="txn-state s-${t.state}">${t.state}</span>
                    </div>
                    <div style="display:flex;justify-content:space-between;margin-top:0.25rem">
                        <span class="card-meta">${t.agent_kid}</span>
                        <span class="card-price">${paise(t.amount_paise)}</span>
                    </div>
                    <div class="card-meta" style="margin-top:0.25rem">
                        ${t.payment_id || '—'} · ${t.payment_mode || 'pending'}
                        ${t.fail_reason ? ' · ' + t.fail_reason : ''}
                    </div>
                    <div class="card-meta">${timeAgo(t.created_at)}</div>
                </div>
            `).join('');
        }

        async function refreshAudit() {
            const data = await fetchJSON(BASE + '/api/v1/audit?limit=30');
            if (!data) return;

            // Chain badge
            const badge = document.getElementById('chain-badge');
            if (data.chain_valid) {
                badge.className = 'badge badge-valid';
                badge.textContent = 'chain: valid ✓';
            } else {
                badge.className = 'badge badge-invalid';
                badge.textContent = 'chain: BROKEN ✗';
            }

            const el = document.getElementById('audit');
            el.innerHTML = data.entries.slice(0, 20).map(a => `
                <div class="audit-event">
                    <span class="seq">#${a.seq}</span>
                    <span class="event-name">${a.event}</span>
                    ${a.to_state ? `→ <span class="txn-state s-${a.to_state}">${a.to_state}</span>` : ''}
                    <span class="timestamp">${timeAgo(a.ts)}</span>
                </div>
            `).join('');
        }

        async function refreshBudget() {
            const data = await fetchJSON(BASE + '/api/v1/budget?agent=agt_coding_01');
            if (!data) return;
            const el = document.getElementById('budget-card');
            const pct = Math.max(0, Math.min(100, (data.remaining_paise / data.daily_pool_paise) * 100));
            const color = pct > 50 ? 'budget-green' : pct > 20 ? 'budget-yellow' : 'budget-red';
            el.innerHTML = `
                <div class="card-title">Budget: ${data.agent}</div>
                <div class="budget-bar"><div class="budget-fill ${color}" style="width:${pct}%"></div></div>
                <div style="display:flex;justify-content:space-between;font-size:0.7rem">
                    <span>Remaining: <b>${paise(data.remaining_paise)}</b></span>
                    <span>Pool: ${paise(data.daily_pool_paise)}</span>
                </div>
                <div class="card-meta" style="margin-top:0.25rem">
                    Held: ${paise(data.held_paise)} · Captured: ${paise(data.captured_paise)} · Released: ${paise(data.released_paise)}
                </div>
            `;
        }

        async function refresh() {
            await Promise.all([refreshCatalog(), refreshTxns(), refreshAudit(), refreshBudget()]);
        }

        refresh();
        setInterval(refresh, 1000);
    </script>
</body>
</html>
